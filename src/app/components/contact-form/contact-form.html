 <section id="contacto" class="py-20 px-4 sm:px-6 lg:px-8 bg-slate-50 dark:bg-slate-900/50">
      <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-12 space-y-4">
          <h2 class="text-4xl md:text-5xl font-bold text-slate-900 dark:text-white">
            Comienza tu prueba gratuita hoy
          </h2>
          <p class="text-lg text-slate-600 dark:text-slate-300">
            Únete a miles de empresas que ya confían en WebLead
          </p>
        </div>

        <!-- Formulario -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-lg border border-slate-100 dark:border-slate-700 p-8 md:p-12">
          <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <!-- Nombre -->
            <div class="group">
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">
                Nombre completo
              </label>
              <input
                type="text"
                formControlName="name"
                class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-300 text-slate-900 dark:text-white placeholder-slate-400"
                placeholder="Tu nombre"
              />
            </div>

            <!-- Email -->
            <!-- <div class="group">
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">
                Correo electrónico
              </label>
              <input
                type="email"
                formControlName="email"
                class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-300 text-slate-900 dark:text-white placeholder-slate-400"
                placeholder="tu@email.com"
              />
            </div> -->

            <!-- Empresa -->
            <!-- <div class="group">
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">
                Nombre de la empresa
              </label>
              <input
                type="text"
                formControlName="company"
                class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-300 text-slate-900 dark:text-white placeholder-slate-400"
                placeholder="Tu empresa"
              />
            </div> -->

            <!-- Teléfono -->
            <div class="group">
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">
                Teléfono
              </label>
              <input
                type="tel"
                formControlName="phone"
                class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-300 text-slate-900 dark:text-white placeholder-slate-400"
                placeholder="+1 (555) 000-0000"
              />
            </div>

            <!-- Mensaje -->
            <div class="group">
              <label class="block text-sm font-semibold text-slate-700 dark:text-slate-200 mb-2">
                ¿Cómo podemos ayudarte?
              </label>
              <textarea
                formControlName="message"
                rows="4"
                class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg focus:outline-none focus:border-emerald-500 focus:ring-2 focus:ring-emerald-500/20 transition-all duration-300 text-slate-900 dark:text-white placeholder-slate-400 resize-none"
                placeholder="Cuéntanos tu caso de uso..."
              ></textarea>
            </div>

            <!-- Checkbox -->
            <!-- <div class="flex items-start space-x-3">
              <input
                type="checkbox"
                id="terms"
                formControlName="terms"
                class="mt-1 w-5 h-5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded cursor-pointer accent-emerald-500"
              />
              <label for="terms" class="text-sm text-slate-600 dark:text-slate-400">
                Acepto recibir actualizaciones y consejos por email
              </label>
            </div> -->

            <!-- Button -->
            <button
              type="submit"
              [disabled]="!contactForm.valid || isLoading"
              class="w-full py-3 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-semibold rounded-lg hover:shadow-xl hover:shadow-emerald-500/50 transition-all duration-300 disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105 hover:-translate-y-1"
            >
            @if (!isLoading) { <span>Comenzar prueba gratuita</span>}
            @if (isLoading) {
               <span  class="flex items-center justify-center space-x-2">
                <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                  <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                  <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Enviando...</span>
              </span>
            }
            </button>

            <!-- Mensaje de éxito -->
             @if (submitSuccess) {
            <div class="p-4 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-200 dark:border-emerald-800 rounded-lg flex items-center space-x-3">
              <svg class="w-5 h-5 text-emerald-600 dark:text-emerald-400 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
              </svg>
              <span class="text-emerald-700 dark:text-emerald-300">¡Gracias! Nos pondremos en contacto pronto.</span>
            </div>
         }
          </form>
        </div>

        <!-- Trust badges -->
        <div class="mt-12 flex flex-wrap justify-center items-center gap-8">
          <div class="flex items-center space-x-2 text-slate-600 dark:text-slate-400">
            <svg class="w-5 h-5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
            <span class="text-sm">GDPR Compliant</span>
          </div>
          <div class="flex items-center space-x-2 text-slate-600 dark:text-slate-400">
            <svg class="w-5 h-5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
            <span class="text-sm">Encriptación SSL</span>
          </div>
          <div class="flex items-center space-x-2 text-slate-600 dark:text-slate-400">
            <svg class="w-5 h-5 text-emerald-500" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
            <span class="text-sm">Respaldo 24/7</span>
          </div>
        </div>
      </div>
    </section>
